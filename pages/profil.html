<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon Profil - Mercato Nova</title>
    <link rel="stylesheet" href="../style.css" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      .profile-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; display: flex; gap: 30px; }
      .profile-nav { width: 250px; display: flex; flex-direction: column; gap: 10px; }
      .profile-nav-btn { padding: 15px 20px; background: #fff; border: 2px solid #f0f0f0; border-radius: 12px; cursor: pointer; text-align: left; font-weight: 700; transition: all 0.2s; }
      .profile-nav-btn:hover { border-color: var(--jaune); background: #fdfaf0; }
      .profile-nav-btn.active { background: var(--jaune); color: #fff; border-color: var(--jaune); }
      .profile-content { flex: 1; background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
      .profile-section-title { font-size: 22px; font-weight: 900; margin-bottom: 25px; color: #111; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .form-group { display: flex; flex-direction: column; gap: 8px; }
      .form-group label { font-size: 14px; font-weight: 700; color: #666; }
      .form-group input { padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 15px; transition: border-color 0.2s; }
      .form-group input:focus { border-color: var(--jaune); outline: none; }
      .history-item { display: flex; align-items: center; gap: 15px; padding: 15px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 12px; }
      .history-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #f0f0f0; }
      .history-info { flex: 1; }
      .history-title { font-weight: 700; font-size: 15px; }
      .history-meta { font-size: 13px; color: #999; margin-top: 2px; }
      .history-price { font-weight: 900; color: var(--jaune); }
      .badge-role { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; text-transform: uppercase; margin-top: 10px; }
      .badge-seller { background: #eaf6fb; color: #2a9bbf; }
      .badge-buyer { background: #fdf8e1; color: #b89a00; }
      .save-btn { background: var(--jaune); color: #fff; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 20px; transition: opacity 0.2s; }
      .save-btn:hover { opacity: 0.9; }
      .btn-danger { background: #ff5757; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" src="../scripts/components.js"></script>
    <script type="text/babel" src="../scripts/profil.js?v=1.1"></script>
  </body>
</html>
