<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration - Mercato Nova</title>
    <link rel="stylesheet" href="../style.css" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .admin-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .admin-nav { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .admin-nav-btn { background: none; border: none; font-size: 18px; font-weight: 700; color: #999; cursor: pointer; padding: 10px 20px; border-radius: 10px; transition: all 0.3s; }
        .admin-nav-btn.active { color: var(--jaune); background: #fdf8e1; }
        .admin-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .admin-table th, .admin-table td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .admin-table th { background: #f9f9f9; font-weight: 800; color: #666; }
        .admin-table tr:hover { background: #fafafa; }
        .btn-action { padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; transition: opacity 0.2s; }
        .btn-edit { background: var(--bleu); color: #fff; margin-right: 5px; }
        .btn-delete { background: #ff5757; color: #fff; }
        .btn-action:hover { opacity: 0.8; }
        .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #fff; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .stat-card h3 { color: #999; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
        .stat-card p { font-size: 32px; font-weight: 900; color: var(--jaune); margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" src="../scripts/components.js"></script>
    <script type="text/babel" src="../scripts/admin.js"></script>
  </body>
</html>
