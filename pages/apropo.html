<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>À propos - Mercato Nova</title>
    <link rel="stylesheet" href="../style.css" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" src="../scripts/components.js"></script>
    <script type="text/babel">

      const valeurs = [
        { icon: "🤝", couleur: "jaune", titre: "Confiance",     texte: "Chaque vendeur est vérifié. Chaque transaction est protégée." },
        { icon: "♻️", couleur: "vert",  titre: "Durabilité",    texte: "Donner une seconde vie aux vêtements pour réduire le gaspillage." },
        { icon: "💬", couleur: "bleu",  titre: "Transparence",  texte: "Des prix justes, des descriptions honnêtes, sans mauvaise surprise." },
        { icon: "🛡️", couleur: "rose",  titre: "Sécurité",      texte: "Paiements sécurisés et service client disponible 7j/7." },
      ];

      const equipe = [
        { initiales: "AL", nom: "Alice L.",   role: "Co-fondatrice & CEO",      bg: "#e4ca3e" },
        { initiales: "TM", nom: "Thomas M.",  role: "Co-fondateur & CTO",       bg: "#68c3e2" },
        { initiales: "SC", nom: "Sarah C.",   role: "Responsable communauté",   bg: "#e6678f" },
      ];

      const faqs = [
        { question: "Comment vendre sur Mercato Nova ?",         reponse: "Créez un compte, publiez votre annonce avec photos et description, fixez votre prix. C'est aussi simple que ça !" },
        { question: "Quels modes de transaction sont disponibles ?", reponse: "Vous pouvez vendre à prix fixe, par enchère ou via une négociation directe avec l'acheteur." },
        { question: "Comment sont protégés mes paiements ?",     reponse: "Tous les paiements transitent par notre système sécurisé. L'argent n'est libéré au vendeur qu'une fois la livraison confirmée." },
        { question: "Puis-je vendre autre chose que des vêtements ?", reponse: "Pour l'instant, Mercato Nova est spécialisé dans la mode. D'autres catégories arriveront prochainement !" },
      ];

      function FaqItem({ question, reponse }) {
        const [open, setOpen] = React.useState(false);
        return (
          <div className="faq-item">
            <h4 onClick={() => setOpen(!open)}>
              {question}
              <span>{open ? "−" : "+"}</span>
            </h4>
            {open && <p>{reponse}</p>}
          </div>
        );
      }

      function App() {
        return (
          <div>
            <Header />

            <div className="about-page">

              {/* HERO */}
              <div className="hero-card">
                <div className="logo-big">MN</div>
                <h1>Mercato Nova</h1>
                <p>La plateforme de mode de seconde main pensée pour tous. Achetez, vendez, négociez et enchérissez en toute confiance.</p>
              </div>

              {/* STATS */}
              <div className="card">
                <p className="section-label">En chiffres</p>
                <h2 className="section-title">Mercato Nova aujourd'hui</h2>
                <div className="stats-grid">
                  <div className="stat-card">
                    <div className="stat-number">+50k</div>
                    <div className="stat-label">Utilisateurs actifs</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-number">+120k</div>
                    <div className="stat-label">Articles vendus</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-number">98%</div>
                    <div className="stat-label">Avis positifs</div>
                  </div>
                </div>
              </div>

              {/* HISTOIRE */}
              <div className="card">
                <p className="section-label">Notre histoire</p>
                <h2 className="section-title">Pourquoi Mercato Nova ?</h2>
                <p className="section-text">
                  Mercato Nova est né d'une idée simple : rendre le commerce de seconde main plus humain, plus flexible et plus juste. Fondée in 2024 par une équipe passionnée de mode et de technologie, notre plateforme permet à chacun d'acheter et de vendre des vêtements de qualité, avec trois mécanismes de transaction uniques : l'achat immédiat, la négociation et les enchères.
                </p>
                <br />
                <p className="section-text">
                  Nous croyons que chaque vêtement mérite une seconde vie, et que chaque transaction doit être une bonne expérience pour les deux parties.
                </p>
              </div>

              {/* VALEURS */}
              <div className="card">
                <p className="section-label">Ce qui nous guide</p>
                <h2 className="section-title">Nos valeurs</h2>
                <div className="valeurs-grid">
                  {valeurs.map((v, i) => (
                    <div className="valeur-item" key={i}>
                      <div className={"valeur-icon " + v.couleur}>{v.icon}</div>
                      <div className="valeur-info">
                        <h4>{v.titre}</h4>
                        <p>{v.texte}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* EQUIPE */}
              <div className="card">
                <p className="section-label">Les gens derrière le projet</p>
                <h2 className="section-title">Notre équipe</h2>
                <div className="equipe-grid">
                  {equipe.map((m, i) => (
                    <div className="membre-card" key={i}>
                      <div className="membre-avatar" style={{backgroundColor: m.bg}}>{m.initiales}</div>
                      <h4>{m.nom}</h4>
                      <p>{m.role}</p>
                    </div>
                  ))}
                </div>
              </div>

              {/* FAQ */}
              <div className="card">
                <p className="section-label">Questions fréquentes</p>
                <h2 className="section-title">FAQ</h2>
                {faqs.map((f, i) => (
                  <FaqItem key={i} question={f.question} reponse={f.reponse} />
                ))}
              </div>

              {/* CONTACT */}
              <div className="card">
                <p className="section-label">On est là pour vous</p>
                <h2 className="section-title">Nous contacter</h2>
                <div className="contact-grid">
                  <div className="contact-item">
                    <span className="contact-icon">✉️</span>
                    <h4>Email</h4>
                    <p>Réponse sous 24h</p>
                    <a href="mailto:contact@mercatonova.fr">contact@mercatonova.fr</a>
                  </div>
                  <div className="contact-item">
                    <span className="contact-icon">💬</span>
                    <h4>Chat en direct</h4>
                    <p>Disponible 7j/7</p>
                    <a href="#">Ouvrir le chat</a>
                  </div>
                  <div className="contact-item">
                    <span className="contact-icon">📱</span>
                    <h4>Réseaux sociaux</h4>
                    <p>@mercatonova</p>
                    <a href="#">Nous suivre</a>
                  </div>
                </div>
              </div>

            </div>

            <Footer />

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
